<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Priyanka & Kiran - Wedding Invitation</title>

  <!-- Elegant Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Keep your real video and image files exactly the same -->
  79131.mp4
  78800_2.jpg

  <style>
    :root {
      --maroon: #850020;
      --gold-light: #f3e5ab;
      --gold-dark: #b8860b;
      --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --text-dark: #333333;
      --burgundy: #7A0C2E;
      --dark-burgundy: #4A0218;
      --gold: #D4AF37;
      --cream: #FAF6EE;
      --soft-white: #FFFDF9;
      --glass-bg: rgba(255, 255, 255, 0.82);
      --glass-border: rgba(212, 175, 55, 0.35);
      --font-script: 'Great Vibes', cursive;
      --font-serif: 'Cinzel', serif;
      --font-subheading: 'Cormorant Garamond', serif;
      --font-sans: 'Montserrat', sans-serif;
      --font-display: 'Cinzel', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 80%;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(-45deg, #FAF6EE, #FFFDF9, #F5EBE0, #FAF6EE);
      background-size: 400% 400%;
      animation: ambientGradient 18s ease infinite;
      font-family: var(--font-sans);
      color: var(--text-dark);
      overflow: hidden;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      touch-action: manipulation;
    }

    body.home-ready {
      overflow-y: auto;
      overflow-x: hidden;
    }

    @keyframes ambientGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .bg-corner-mandalas {
      background-color: var(--maroon);
      background-image:
        radial-gradient(circle at top right, rgba(212,175,55,0.26), transparent 36%),
        radial-gradient(circle at bottom left, rgba(212,175,55,0.26), transparent 36%);
      background-position: top right, bottom left;
      background-repeat: no-repeat;
      background-size: 320px 320px, 320px 320px;
    }

    /* Envelope Screen */
    #envelope-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      background-color: var(--cream);
      background-image: url('78800_2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      perspective: 1200px;
      transition: opacity 0.8s ease;
      will-change: opacity;
    }

    #envelope-wrapper::before,
    #envelope-wrapper::after {
      content: '';
      position: absolute;
      width: 130px;
      height: 130px;
      pointer-events: none;
      opacity: 0.55;
    }

    #envelope-wrapper::before {
      top: 28px;
      left: 28px;
      border-top: 2px solid var(--gold-dark);
      border-left: 2px solid var(--gold-dark);
    }

    #envelope-wrapper::after {
      bottom: 28px;
      right: 28px;
      border-bottom: 2px solid var(--gold-dark);
      border-right: 2px solid var(--gold-dark);
    }

    .envelope-subtitle {
      font-family: var(--font-display);
      letter-spacing: 5px;
      font-size: 1.1rem;
      color: var(--maroon);
      margin-bottom: 55px;
      text-transform: uppercase;
      text-align: center;
      background-color: var(--soft-white);
      padding: 10px 20px;
      border-radius: 4px;
      border: 2px solid var(--gold);
      box-shadow: 0 12px 28px rgba(0,0,0,0.26);
      z-index: 2;
    }

    .tap-text {
      margin-top: 65px;
      font-family: var(--font-subheading);
      font-style: italic;
      font-size: 1.25rem;
      color: var(--maroon);
      animation: pulse 2s infinite ease-in-out;
      background-color: var(--soft-white);
      padding: 9px 24px;
      border-radius: 4px;
      border: 2px solid var(--gold);
      box-shadow: 0 12px 28px rgba(0,0,0,0.26);
      z-index: 2;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
    }

    .envelope {
      position: relative;
      width: 500px;
      height: 350px;
      transform-style: preserve-3d;
      animation: floatingEnv 5s ease-in-out infinite;
      z-index: 3;
    }

    @keyframes floatingEnv {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .envelope.open-anim {
      animation: none;
      transform: scale(1.03);
    }

    .envelope-back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #7A0C2E, #4A0218);
      border-radius: 5px;
      box-shadow: 0 22px 45px rgba(0,0,0,0.38);
    }

    .letter {
      position: absolute;
      bottom: 5px;
      left: 2.5%;
      width: 95%;
      height: 95%;
      background: linear-gradient(to bottom, #FFFDF9, #FAF6EE);
      border: 2px solid var(--gold-dark);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 1s ease 0.6s, opacity 0.8s ease 0.9s, filter 0.8s ease;
      z-index: 2;
      padding: 20px;
    }

    .letter h1 {
      font-family: var(--font-script);
      color: var(--maroon);
      font-size: 3rem;
      margin: 10px 0;
      line-height: 1.1;
    }

    .letter.pull {
      transform: translateY(-125%) scale(1.08);
      opacity: 0;
      filter: blur(8px);
    }

    .envelope-front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-left: 250px solid #73001c;
      border-right: 250px solid #73001c;
      border-bottom: 175px solid #540015;
      border-top: 175px solid transparent;
      z-index: 3;
      pointer-events: none;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-top: 190px solid #600018;
      border-left: 250px solid transparent;
      border-right: 250px solid transparent;
      border-bottom: 160px solid transparent;
      transform-origin: top;
      transition: transform 0.85s ease;
      z-index: 4;
    }

    .envelope-flap.open {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .wax-seal {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 85px;
      height: 85px;
      background: var(--gold-gradient);
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.45), inset 0 0 14px rgba(255,255,255,0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.25s ease;
    }

    .wax-seal:active {
      transform: translateX(-50%) scale(0.95);
    }

    .wax-seal span {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: bold;
      color: var(--dark-burgundy);
    }

    /* Video Overlay */
    #video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      background: rgba(250, 246, 238, 0.98);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      will-change: opacity;
    }

    #video-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      cursor: pointer;
    }

    #intro-video {
      width: 90%;
      max-width: 450px;
      max-height: 84dvh;
      border-radius: 15px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.38), 0 0 0 2px var(--gold);
      object-fit: cover;
      background: #000;
      transform: translateZ(0);
    }

    .skip-hint {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      color: var(--gold-light);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.78rem;
      border: 1px solid var(--gold);
      font-family: var(--font-sans);
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
    }

    /* Main Content */
    .content-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      transform: translateZ(0);
    }

    nav {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.9);
      z-index: 1000;
      border-bottom: 1px solid rgba(212,175,55,0.25);
      padding: 12px 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
    }

    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: var(--burgundy);
      font-family: var(--font-serif);
      font-size: 0.75rem;
      letter-spacing: 1.8px;
      font-weight: 600;
      text-transform: uppercase;
      position: relative;
    }

    .section-tagline,
    .section-subheader {
      font-family: var(--font-serif);
      letter-spacing: 4px;
      font-size: 0.78rem;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 14px;
      text-align: center;
    }

    .section-title,
    .section-header {
      font-family: var(--font-script);
      font-size: 4rem;
      color: var(--burgundy);
      text-align: center;
      margin-bottom: 14px;
    }

    .hero {
      padding: 80px 20px 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-names {
      font-family: var(--font-script);
      font-size: 5.4rem;
      color: var(--burgundy);
      line-height: 1.05;
      margin: 20px 0;
      background: linear-gradient(to right, #7A0C2E, #b8860b, #7A0C2E);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shimmerGold 8s linear infinite;
    }

    @keyframes shimmerGold {
      0% { background-position: -100% 50%; }
      100% { background-position: 200% 50%; }
    }

    .hero-ampersand {
      display: block;
      font-family: var(--font-subheading);
      font-size: 2.4rem;
      font-style: italic;
      color: var(--gold);
      margin: 8px 0;
    }

    .parents-blessing {
      font-family: var(--font-subheading);
      font-size: 1rem;
      color: #666;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .hero-quote {
      font-family: var(--font-subheading);
      font-style: italic;
      max-width: 560px;
      margin: 0 auto 20px;
      color: #555;
      font-size: 1.25rem;
      line-height: 1.55;
    }

    .hero-details-badge {
      display: inline-flex;
      gap: 18px;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(212,175,55,0.45);
      padding: 10px 24px;
      border-radius: 40px;
      font-family: var(--font-serif);
      font-size: 0.88rem;
      color: var(--burgundy);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-top: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .save-date-container,
    .love-story,
    #countdown,
    .events-section {
      max-width: 820px;
      margin: 65px auto;
      padding: 0 20px;
      position: relative;
      z-index: 2;
    }

    .save-date-container {
      max-width: 430px;
      text-align: center;
    }

    .scratch-card {
      background: linear-gradient(135deg, var(--burgundy), var(--dark-burgundy));
      padding: 40px 16px;
      border-radius: 20px;
      border: 2px solid var(--gold);
      position: relative;
      cursor: pointer;
      user-select: none;
      margin-top: 22px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 34px rgba(0,0,0,0.18);
      overflow: hidden;
    }

    .secret-content {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.95);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .scratch-card.revealed .secret-content {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .reveal-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(45deg, #bf953f, #fdf6ba, #d4af37, #ffed8a, #aa771c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      color: var(--dark-burgundy);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 2.5px;
      transition: opacity 0.5s ease;
      z-index: 5;
      text-align: center;
      padding: 15px;
    }

    .scratch-card.revealed .reveal-overlay {
      opacity: 0;
      pointer-events: none;
    }

    .section-subtitle {
      font-family: var(--font-subheading);
      text-align: center;
      font-style: italic;
      color: #666;
      margin-bottom: 40px;
      font-size: 1.18rem;
      line-height: 1.6;
    }

    .timeline {
      position: relative;
      margin-left: 20px;
      padding-left: 35px;
    }

    .timeline::before,
    .timeline-progress {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
    }

    .timeline::before {
      height: 100%;
      background: rgba(212,175,55,0.22);
    }

    .timeline-progress {
      height: 0%;
      background: var(--gold);
      transition: height 1s ease;
    }

    .timeline-item {
      margin-bottom: 32px;
      position: relative;
    }

    .timeline-item::before {
      content: '♥';
      position: absolute;
      left: -43px;
      top: 0;
      background: #fff;
      color: var(--burgundy);
      border: 2px solid var(--gold);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      z-index: 2;
    }

    .timeline-date {
      font-family: var(--font-serif);
      font-size: 0.8rem;
      color: var(--gold-dark);
      font-weight: 700;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 5px;
    }

    .timeline-title {
      font-family: var(--font-subheading);
      font-size: 1.5rem;
      color: var(--burgundy);
      font-weight: 600;
    }

    .timeline-desc {
      font-size: 0.95rem;
      color: #555;
      margin-top: 8px;
      line-height: 1.55;
    }

    .countdown-wrapper {
      padding: 46px 16px;
      border-radius: 20px;
      border: 2px solid var(--gold);
      color: #fff;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.18);
    }

    .countdown-wrapper .section-header {
      color: #fff;
    }

    .countdown-wrapper .section-subheader {
      color: var(--gold-light);
    }

    #timer {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 22px;
      margin-top: 32px;
    }

    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 74px;
      padding: 12px;
      border-radius: 15px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(243,229,171,0.3);
    }

    .time-num {
      font-family: var(--font-serif);
      font-size: 3.6rem;
      color: var(--gold-light);
      line-height: 1;
      font-weight: 700;
      transition: opacity 0.15s ease;
    }

    .time-label {
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 2px;
      margin-top: 10px;
      color: rgba(255,255,255,0.8);
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin-top: 32px;
    }

    .event-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 32px 16px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.28s ease, box-shadow 0.28s ease;
      position: relative;
      overflow: hidden;
    }

    .event-card:active {
      transform: scale(0.98);
    }

    .event-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 36px rgba(122,12,46,0.12);
    }

    .event-icon {
      font-size: 2.8rem;
      margin-bottom: 14px;
      display: inline-block;
    }

    .event-name {
      font-family: var(--font-script);
      font-size: 3rem;
      color: var(--burgundy);
      margin-bottom: 12px;
    }

    .event-detail {
      font-size: 0.95rem;
      color: #444;
      margin: 8px 0;
    }

    .tap-to-reveal-text {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--maroon);
      letter-spacing: 1.7px;
      margin-top: 22px;
      display: inline-block;
      padding: 9px 18px;
      border: 1px solid rgba(133,0,32,0.3);
      border-radius: 30px;
      background: rgba(255,255,255,0.55);
    }

    .sides-section {
      padding: 65px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
      border-top: 1px solid rgba(212,175,55,0.15);
      border-bottom: 1px solid rgba(212,175,55,0.15);
    }

    .sides-container {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .side-btn {
      background: rgba(255,255,255,0.85);
      border: 2px solid rgba(212,175,55,0.35);
      border-radius: 20px;
      padding: 20px 32px;
      cursor: pointer;
      width: 150px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
      transition: transform 0.25s ease, border-color 0.25s ease;
      position: relative;
    }

    .side-btn h4 {
      font-family: var(--font-serif);
      color: var(--burgundy);
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .side-btn span {
      font-family: var(--font-script);
      font-size: 2.1rem;
      color: var(--gold-dark);
    }

    .side-btn.active {
      border-color: var(--burgundy);
      transform: scale(1.06);
      box-shadow: 0 14px 30px rgba(122,12,46,0.15);
    }

    .side-btn.active::after {
      content: '♥';
      position: absolute;
      top: 8px;
      right: 14px;
      color: var(--maroon);
      font-size: 1.2rem;
    }

    .rsvp-section {
      padding: 80px 20px;
      border-top: 3px solid var(--gold);
      position: relative;
    }

    .rsvp-form-container {
      max-width: 460px;
      margin: 0 auto;
      background: #fff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.14);
      border: 2px solid var(--gold);
      text-align: left;
      position: relative;
      z-index: 2;
    }

    .rsvp-form-container h3 {
      font-family: var(--font-script);
      font-size: 3.7rem;
      color: var(--maroon);
      text-align: center;
      margin-bottom: 10px;
      line-height: 1;
    }

    .rsvp-form-container p.subtitle {
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 32px;
      color: #666;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #777;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .form-control {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #e0d7c6;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 1rem;
      background: #FAF6EE;
      color: #333;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--gold-dark);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(212,175,55,0.18);
    }

    .pill-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pill-btn {
      flex: 1;
      min-width: 120px;
      text-align: center;
      padding: 12px 10px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 30px;
      background: #FAF6EE;
      color: #666;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .pill-btn.selected {
      background: linear-gradient(135deg, var(--maroon), var(--dark-burgundy));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 18px rgba(133,0,32,0.22);
    }

    .btn-whatsapp {
      display: flex;
      width: 100%;
      background: #25D366;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
      box-shadow: 0 10px 24px rgba(37,211,102,0.28);
      transition: transform 0.25s ease;
    }

    .btn-whatsapp:active {
      transform: scale(0.96);
    }

    footer {
      background: linear-gradient(to bottom, var(--dark-burgundy), #2a010d);
      color: var(--gold-light);
      text-align: center;
      padding: 65px 20px 48px;
      border-top: 2px solid var(--gold);
      position: relative;
      z-index: 2;
    }

    footer h2 {
      font-family: var(--font-script);
      font-size: 4.5rem;
      margin-bottom: 20px;
      color: #fff;
    }

    footer p {
      font-family: var(--font-subheading);
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 20px;
      color: rgba(255,255,255,0.82);
      font-style: italic;
      line-height: 1.6;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .close-modal {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: 22px;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 10002;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
    }

    .modal-content-box {
      width: 90%;
      max-width: 450px;
      height: 75dvh;
      max-height: 700px;
      background: #000;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(0,0,0,0.48);
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content-box {
      transform: scale(1);
    }

    .modal-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.74);
    }

    .modal-content-box::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48%;
      background: linear-gradient(to top, rgba(0,0,0,0.82), transparent);
      z-index: 2;
      pointer-events: none;
    }

    .modal-title {
      position: absolute;
      bottom: 36px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 6;
      font-family: var(--font-script);
      color: #fff;
      font-size: 3.4rem;
      text-shadow: 2px 4px 15px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }

    .modal-title.show {
      opacity: 1;
      transform: translateY(0);
    }

    .event-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(250,246,238,0.96);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .event-cover.hidden {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    .wedding-tap-icon {
      font-size: 4.5rem;
      cursor: pointer;
      animation: pulse 2s infinite ease-in-out;
    }

    #haldi-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 3;
      cursor: pointer;
      touch-action: none;
      transition: opacity 0.5s ease;
    }

    .canvas-cleared {
      opacity: 0;
      pointer-events: none;
    }

    .svg-butterfly {
      width: 100px;
      height: 100px;
      cursor: pointer;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    #petal-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      pointer-events: none;
      z-index: 998;
      overflow: hidden;
      display: none;
    }

    .bg-petal {
      position: absolute;
      top: -20px;
      border-radius: 15px 0 15px 0;
      opacity: 0.35;
      animation: fall linear infinite, sway ease-in-out infinite alternate;
      pointer-events: none;
    }

    .bg-petal.maroon {
      background: var(--maroon);
    }

    .bg-petal.gold {
      background: var(--gold);
    }

    @keyframes fall {
      to { top: 110vh; transform: rotate(360deg); }
    }

    @keyframes sway {
      from { margin-left: 0; }
      to { margin-left: 80px; }
    }

    .elegant-particle {
      position: absolute;
      pointer-events: none;
      z-index: 10005;
      animation: popOutElegant 2s ease forwards;
    }

    .part-petal {
      width: 11px;
      height: 11px;
      border-radius: 15px 0 15px 0;
    }

    .part-maroon {
      background: var(--maroon);
    }

    .part-gold {
      background: var(--gold);
    }

    .part-heart {
      width: 14px;
      height: 14px;
      color: var(--maroon);
      font-size: 14px;
    }

    @keyframes popOutElegant {
      0% { opacity: 1; transform: translate(0,0) scale(0.3) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); }
    }

    .small-butterfly {
      position: absolute;
      width: 35px;
      height: 35px;
      z-index: 10001;
      opacity: 0;
      pointer-events: none;
      animation: flutterAway 2.8s ease forwards;
    }

    @keyframes flutterAway {
      0% { transform: translate(0,0) scale(0.5) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--bx), var(--by)) scale(1.4) rotate(var(--brot)); opacity: 0; }
    }

    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(35px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      html {
        font-size: 76%;
      }

      #envelope-wrapper::before,
      #envelope-wrapper::after {
        width: 75px;
        height: 75px;
      }

      .envelope {
        width: 280px;
        height: 196px;
      }

      .envelope-front {
        border-left-width: 140px;
        border-right-width: 140px;
        border-bottom-width: 98px;
        border-top-width: 98px;
      }

      .envelope-flap {
        border-top-width: 110px;
        border-left-width: 140px;
        border-right-width: 140px;
        border-bottom-width: 86px;
      }

      .wax-seal {
        width: 60px;
        height: 60px;
        top: -25px;
      }

      .wax-seal span {
        font-size: 1.4rem;
      }

      .letter h1 {
        font-size: 2.2rem;
      }

      .envelope-subtitle {
        margin-bottom: 45px;
        font-size: 0.82rem;
        padding: 7px 12px;
      }

      .tap-text {
        margin-top: 40px;
        font-size: 1rem;
        padding: 7px 14px;
      }

      .hero {
        padding: 64px 16px 45px;
      }

      .hero-names {
        font-size: 4.1rem;
      }

      .section-title,
      .section-header {
        font-size: 3.4rem;
      }

      .hero-details-badge {
        flex-direction: column;
        gap: 8px;
        border-radius: 22px;
      }

      .events-grid {
        grid-template-columns: 1fr;
      }

      #timer {
        gap: 12px;
      }

      .time-box {
        min-width: 68px;
      }

      .time-num {
        font-size: 2.6rem;
      }

      .modal-content-box {
        width: 94%;
        height: 72dvh;
      }

      .modal-title {
        font-size: 3rem;
      }
    }
  </style>
</head>
